name: Browser demo compatibility

on:
  pull_request:
    paths:
      - .github/workflows/browser-demo.yml
      - scripts/prepare-browser-demo.mjs
      - public/demo.mp4
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sample:
    name: Prepare portable sample
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Ensure the distribution's FFmpeg is available
        run: |
          if ! command -v ffmpeg >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y ffmpeg
          fi
      - name: Prepare and verify the additional sample format
        run: node scripts/prepare-browser-demo.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-demo-${{ github.event.pull_request.head.sha || github.sha }}
          path: browser-demo/
          if-no-files-found: error
          retention-days: 2
